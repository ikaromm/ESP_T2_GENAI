name: baseline-run
output_dir: outputs
seed: 42
data:
  root: data/raw/findsum
  task: liquidity
  eval_split: val
  example_split: train
  n_eval_docs: 100
  n_example_docs: 500
  example_max_words: 350
retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 220
  chunk_overlap: 40
  top_k: 12
  query_words: 400
  include_tables: true
generation:
  model_name: Qwen/Qwen2.5-7B-Instruct
  load_in_4bit: true
  max_new_tokens: 1536
  temperature: 0.0
  top_p: 1.0
  seed: 42
  max_input_tokens: 12288
  dtype: bfloat16
arms:
- id: C1
  label: Baseline (sem RAG, sem few-shot)
  use_rag: false
  example_strategy: none
  n_examples: 0
- id: C2
  label: RAG
  use_rag: true
  example_strategy: none
  n_examples: 0
- id: C3
  label: RAG + few-shot fixo
  use_rag: true
  example_strategy: fixed
  n_examples: 2
- id: C4
  label: RAG + few-shot aleatorio
  use_rag: true
  example_strategy: random
  n_examples: 2
- id: C5
  label: RAG + few-shot dinamico
  use_rag: true
  example_strategy: dynamic
  n_examples: 2
