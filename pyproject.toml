[project]
name = "findsum-rag"
version = "0.1.0"
description = "Avaliacao de RAG e few-shot prompting na sumarizacao de relatorios financeiros longos (FINDSum)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # dados
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
    # recuperacao / embeddings
    "sentence-transformers>=3.3.1",
    "faiss-cpu>=1.9.0",
    # geracao
    "torch>=2.5.1",
    "transformers>=4.47.1",
    "accelerate>=1.2.1",
    "bitsandbytes>=0.45.0",
    # avaliacao
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "scipy>=1.14.1",
    "numpy>=1.26.4",
    # infraestrutura
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
    "typer>=0.15.1",
]

[project.scripts]
findsum = "findsum_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findsum_rag"]

[tool.uv]
# torch para CUDA vem do indice oficial; o default do PyPI em linux x86_64
# ja embute CUDA 12, mas fixamos o indice para tornar a resolucao explicita.
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer declara opcoes de CLI como defaults de argumento; e o idioma da lib.
"src/findsum_rag/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: carrega uma LLM de verdade; desative com -m 'not slow'",
]
